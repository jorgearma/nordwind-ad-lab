# Web estática + Cloudflare Tunnel embebido (uno POR PROYECTO).
# El túnel es parte del proyecto: la web no publica puertos en el host y no
# tiene salida a Internet.
#
#   Internet → Cloudflare → túnel de nordwind → cloudflared (uid 65532)
#                                                 │ nordwind_internal (internal: true)
#                                                 ▼ http://web:8080
#                                               web (nginx, uid 101) · sin salida · sin ports
#
# Antes de levantar: crear el túnel dedicado en Zero Trust (uno POR PROYECTO) y
# guardar su token en secrets/tunnel_token (fichero 444, sin salto de línea final).
# Hostname público del túnel → ad-lab.jorgearmandoescobar.com → http://web:8080

x-hardening: &hardening
  read_only: true                    # OWASP #8
  cap_drop: [ALL]                    # OWASP #3
  security_opt:
    - no-new-privileges:true         # OWASP #4 (seccomp/AppArmor por defecto, #6)
  restart: unless-stopped            # web pública → prioriza volver tras reinicio
  logging:                           # sin límite, json-file crece hasta llenar el disco
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ── WEB ───────────────────────────────────────────────────
  web:
    <<: *hardening
    build: .
    image: nordwind-web:latest
    container_name: nordwind-web
    # SIN ports: solo la alcanza cloudflared por la red interna (OWASP #5a
    # cumplido por diseño: no hay nada publicado en el host).

    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev

    mem_limit: 128m                  # OWASP #7
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 100                  # NO ulimits.nproc
    ulimits:
      nofile: { soft: 1024, hard: 2048 }

    networks: [internal]             # OWASP #5: sin salida a Internet

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]   # 127.0.0.1, no localhost (IPv6)
      interval: 30s
      timeout: 3s
      retries: 3

  # ── TÚNEL ─────────────────────────────────────────────────
  cloudflared:
    <<: *hardening
    # OWASP #13: versión + digest. Actualizar: docker pull + docker inspect RepoDigests
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    container_name: nordwind-web-tunnel
    # La imagen ya corre como 65532:65532 (distroless, sin shell).
    # --token-file + secret: el token NO va en environment (TUNNEL_TOKEN) ni en
    # la línea de comandos (se vería en docker inspect / ps). OWASP #12.
    # --metrics 127.0.0.1: por defecto escucha en 0.0.0.0 y la web podría
    # consultarlo por la red interna.
    command: >-
      tunnel --no-autoupdate --metrics 127.0.0.1:20241
      run --token-file /run/secrets/tunnel_token
    secrets: [tunnel_token]

    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 100

    networks:
      - internal                     # llegar a http://web:8080
      - egress                       # salir hacia Cloudflare (único servicio con salida)

    healthcheck:
      # Sin shell ni wget en la imagen: el propio binario consulta /ready
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3

    depends_on:
      web:
        condition: service_healthy

networks:
  internal:
    name: nordwind_internal
    internal: true                   # sin salida a Internet; Docker no publica puertos en redes internal
    ipam:
      config:
        # Fija y única por proyecto: nginx.conf solo se fía de CF-Connecting-IP
        # desde aquí (set_real_ip_from). Si la cambias, cambia también nginx.conf.
        - subnet: 172.30.90.0/24
  egress:
    name: nordwind_egress
    driver: bridge

secrets:
  tunnel_token:
    # secrets/ con 700, fichero con 444 (lo lee el uid 65532), sin salto de línea final.
    # secrets/ en .gitignore Y .dockerignore.
    file: ./secrets/tunnel_token
