services:
  web:
    build: .
    image: nordwind-ad-lab-web:latest
    container_name: nordwind-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"   # SOLO localhost: Docker se salta ufw. Fuera entra por el túnel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]   # 127.0.0.1, no localhost (IPv6)
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    # --- bloque de hardening (plantilla §3) ---
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
