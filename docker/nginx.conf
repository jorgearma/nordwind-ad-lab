server {
    # 8080 y no 80: sin root no se pueden abrir puertos < 1024
    listen      8080;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # IP real del visitante (Cloudflare → cloudflared embebido → red interna del proyecto)
    # Solo se confía en la subnet nordwind_internal (compose.yaml). Si cambia allí, cambiar aquí.
    set_real_ip_from 172.30.90.0/24;
    real_ip_header   CF-Connecting-IP;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (HSTS NO va aquí: lo pone Cloudflare). "always" = también en 404/502
    add_header X-Frame-Options              "DENY" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # CSP a medida (inventario: <script>/<style>/style="" inline en todas las páginas,
    # Google Fonts en diagrams/). Enforced: auditado (sin data:/scripts externos; img y fuentes cubiertos)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Contacto para vulnerabilidades (RFC 9116). Expires < 1 año → renovar
    location = /.well-known/security.txt {
        default_type "text/plain; charset=utf-8";
        return 200 "Contact: mailto:jorgesiemprearmando@gmail.com\nExpires: 2027-10-31T00:00:00Z\nPreferred-Languages: es, en\n";
    }

    # Ocultos (.git, .env…), extensiones sensibles y ruido de bots → 404 real
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(env|ini|log|bak|sql|tar|gz|zip|old|swp|ps1|csv)$ { return 404; }
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|adminer) { return 404; }

    # Estáticos con NOMBRE FIJO (lab.css, engine.js) → caché corta. Si tuvieran hash → expires 1y
    # Solo "expires": un add_header aquí borraría todas las cabeceras de arriba
    location ~* \.(css|js|woff2?|ttf|ico|png|jpe?g|webp|svg|avif)$ {
        limit_except GET HEAD { deny all; }
        expires 1h;
        try_files $uri =404;
    }

    # Web estática: solo GET/HEAD. Sin soft 404
    location / {
        limit_except GET HEAD { deny all; }
        expires 5m;
        try_files $uri $uri/ =404;
    }
}
